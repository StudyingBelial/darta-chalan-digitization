<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nepal Telecom - Darta & Chalan Digitization Portal</title>
    <!-- Non-blocking font loading with fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    </noscript>
  </head>
  <body>
    <div id="root">
      <!-- Instant Visual Feedback (Replaced immediately when React mounts) -->
      <div id="ntc-instant-loader" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#001f3f,#003b73);color:#ffffff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;padding:1.5rem;">
        <div style="width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#00a8cc,#00b4d8);display:flex;align-items:center;justify-content:center;margin-bottom:1.25rem;box-shadow:0 4px 15px rgba(0,168,204,0.4);">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <h1 style="font-size:1.35rem;font-weight:800;margin:0 0 0.35rem 0;letter-spacing:0.02em;">NEPAL TELECOM</h1>
        <p style="font-size:0.875rem;color:#a5f3fc;margin:0 0 1.5rem 0;">Darta & Chalan Digitization System</p>
        <div style="width:32px;height:32px;border:3px solid rgba(255,255,255,0.25);border-top-color:#00a8cc;border-radius:50%;animation:ntcSpin 0.8s linear infinite;"></div>
        <p id="ntc-loader-status" style="font-size:0.8rem;color:#cbd5e1;margin-top:1rem;">Loading application interface...</p>
      </div>
      <style>
        @keyframes ntcSpin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Intranet/Offline safeguard: If React takes more than 4s, provide interactive help
      setTimeout(function() {
        var status = document.getElementById('ntc-loader-status');
        if (status && document.getElementById('ntc-instant-loader')) {
          status.innerHTML = 'Starting system... If stuck, <a href="javascript:location.reload()" style="color:#38bdf8;text-decoration:underline;font-weight:600;">click here to refresh</a>.';
        }
      }, 4000);
      window.addEventListener('error', function(e) {
        var status = document.getElementById('ntc-loader-status');
        if (status && document.getElementById('ntc-instant-loader')) {
          status.innerHTML = '<span style="color:#fca5a5;">Resource issue: ' + (e.message || 'Script blocked or network error') + '</span><br><a href="javascript:location.reload()" style="color:#38bdf8;text-decoration:underline;margin-top:6px;display:inline-block;">Tap to Retry</a>';
        }
      });
    </script>
  </body>
</html>
