version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ntc_digitization_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
      - "${SMTP_SCANNER_PORT:-1025}:1025"
    environment:
      - PROJECT_NAME=Nepal Telecom Darta-Chalan Digitization System
      - DATABASE_URL=sqlite:////app/data/digitization.db
      - SECRET_KEY=${SECRET_KEY:-ntc_digitization_production_secret_key_2081_change_me}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - REFRESH_TOKEN_EXPIRE_HOURS=24
      - UPLOAD_DIR=/app/storage/uploads
      - CORS_ORIGINS=["*"]
      - SMTP_SCANNER_ENABLED=${SMTP_SCANNER_ENABLED:-true}
      - SMTP_SCANNER_HOST=0.0.0.0
      - SMTP_SCANNER_PORT=1025
      - SMTP_SCANNER_ALLOWED_DOMAINS=${SMTP_SCANNER_ALLOWED_DOMAINS:-ntc.net.np,gov.np}
    volumes:
      # Persistent storage volume for scanned PDF and image attachments
      - backend_uploads:/app/storage/uploads
      # Persistent volume for database file
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ntc_digitization_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
    name: ntc_digitization_uploads
  backend_data:
    name: ntc_digitization_db_data
